<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생성형 AI 교육 만족도 설문조사</title>
    <!-- 구글 폰트: Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* [CSS: 디자인 시스템 정의] */
        :root {
            --primary-color: #2563EB; /* AI 기술의 신뢰감을 주는 블루 */
            --primary-light: #DBEAFE;
            --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-sub: #64748B;
            --input-bg: #F1F5F9;
            --border-radius: 20px;
            --shadow-soft: 0 20px 40px -15px rgba(37, 99, 235, 0.15);
            --star-inactive: #E2E8F0;
            --star-active: #F59E0B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-main);
            background-image: linear-gradient(to top right, #F8FAFC 0%, #EFF6FF 100%);
        }

        /* 메인 컨테이너 */
        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 48px 32px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-soft);
        }

        /* 헤더 영역 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        header p {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.6;
            font-weight: 400;
        }

        /* 폼 요소 스타일 */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            padding-left: 4px;
        }

        /* 입력 필드 스타일 */
        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 16px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, textarea:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        textarea {
            resize: none;
            min-height: 100px;
        }

        /* 별점 영역 */
        .rating-container {
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 10px 0;
            background-color: var(--input-bg);
            border-radius: 16px;
        }

        .rating-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        .star-label {
            cursor: pointer;
            width: 44px;
            height: 44px;
            color: var(--star-inactive);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .star-label svg {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.05));
        }

        .star-label:hover {
            transform: scale(1.15);
        }

        .star-label.active {
            color: var(--star-active);
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* 칩(Chip) 스타일 */
        .chip-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip-label {
            position: relative;
            cursor: pointer;
        }

        .chip-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .chip-text {
            display: inline-block;
            padding: 12px 18px;
            background-color: var(--input-bg);
            color: var(--text-sub);
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .chip-input:checked + .chip-text {
            background-color: var(--primary-light);
            color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 700;
            box-shadow: 0 4px 10px -3px rgba(37, 99, 235, 0.2);
        }

        /* 제출 버튼 */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            box-shadow: 0 10px 20px -10px rgba(37, 99, 235, 0.5);
            position: relative;
            overflow: hidden;
        }

        .submit-btn:disabled {
            background: #E5E7EB;
            color: #9CA3AF;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 로딩 스피너 애니메이션 */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.1);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal h3 {
            margin-bottom: 12px;
            font-size: 20px;
            color: var(--text-main);
        }

        .modal p {
            margin-bottom: 24px;
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.5;
        }

        .modal-btn {
            background: var(--primary-color);
            color: white;
            padding: 14px 0;
            width: 100%;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AI 교육은 유익하셨나요?</h1>
            <p>더 나은 교육 프로그램을 위해<br>여러분의 솔직한 의견을 들려주세요.</p>
        </header>

        <form id="surveyForm">
            <!-- 기본 정보 -->
            <div class="form-group">
                <label for="name">성함</label>
                <input type="text" id="name" name="name" placeholder="성함을 입력해주세요" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="affiliation">소속 (회사 또는 부서)</label>
                <input type="text" id="affiliation" name="affiliation" placeholder="소속 기관을 입력해주세요" required>
            </div>

            <div class="form-group">
                <label for="phone">연락처</label>
                <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" maxlength="13" required autocomplete="tel">
            </div>

            <!-- 만족도 점수 -->
            <div class="form-group">
                <label>전반적인 교육 만족도</label>
                <div class="rating-container">
                    <label class="star-label" data-value="1">
                        <input type="radio" name="rating" value="1" class="rating-input" required>
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </label>
                    <label class="star-label" data-value="2">
                        <input type="radio" name="rating" value="2" class="rating-input">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </label>
                    <label class="star-label" data-value="3">
                        <input type="radio" name="rating" value="3" class="rating-input">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </label>
                    <label class="star-label" data-value="4">
                        <input type="radio" name="rating" value="4" class="rating-input">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </label>
                    <label class="star-label" data-value="5">
                        <input type="radio" name="rating" value="5" class="rating-input">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    </label>
                </div>
            </div>

            <!-- 유익했던 항목 (중복 선택) -->
            <div class="form-group">
                <label>가장 유익했던 항목 (중복 선택)</label>
                <div class="chip-group">
                    <label class="chip-label">
                        <input type="checkbox" name="improvement" value="프롬프트 엔지니어링" class="chip-input">
                        <span class="chip-text">프롬프트 기술</span>
                    </label>
                    <label class="chip-label">
                        <input type="checkbox" name="improvement" value="이미지 생성 AI" class="chip-input">
                        <span class="chip-text">이미지 생성</span>
                    </label>
                    <label class="chip-label">
                        <input type="checkbox" name="improvement" value="업무 자동화 활용" class="chip-input">
                        <span class="chip-text">업무 자동화</span>
                    </label>
                    <label class="chip-label">
                        <input type="checkbox" name="improvement" value="데이터 분석 도구" class="chip-input">
                        <span class="chip-text">데이터 분석</span>
                    </label>
                    <label class="chip-label">
                        <input type="checkbox" name="improvement" value="AI 윤리 및 보안" class="chip-input">
                        <span class="chip-text">윤리 및 보안</span>
                    </label>
                </div>
            </div>

            <!-- 추가 의견 -->
            <div class="form-group">
                <label for="feedback">기타 의견 및 건의사항</label>
                <textarea id="feedback" name="feedback" placeholder="교육 내용 중 아쉬웠던 점이나 강사님께 전하고 싶은 말을 자유롭게 적어주세요."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="spinner" id="loadingSpinner"></span>
                <span id="btnText">설문 결과 제출하기</span>
            </button>
        </form>
    </div>

    <!-- 완료 모달 -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <h3>설문 제출 완료!</h3>
            <p>보내주신 소중한 의견은<br>다음 교육 프로그램 기획에<br>적극 반영하도록 하겠습니다.</p>
            <button class="modal-btn" onclick="closeModal()">닫기</button>
        </div>
    </div>

    <script>
        /* [JS: 설정 및 기능] */
        
        // ★ 입력해주신 웹 앱 URL 반영 ★
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBMRfy0-GBau1cWgENsxUxSDjJivbImen9ZofqACORDM1I5yZWh_zn1G-slMrSuQR7bQ/exec'; 

        // 1. 휴대폰 번호 자동 포맷팅
        document.getElementById('phone').addEventListener('input', (e) => {
            const rawValue = e.target.value.replace(/[^0-9]/g, '');
            let formattedValue = '';
            if (rawValue.length < 4) formattedValue = rawValue;
            else if (rawValue.length < 8) formattedValue = `${rawValue.slice(0, 3)}-${rawValue.slice(3)}`;
            else formattedValue = `${rawValue.slice(0, 3)}-${rawValue.slice(3, 7)}-${rawValue.slice(7, 11)}`;
            e.target.value = formattedValue;
        });

        // 2. 별점 인터랙션
        const stars = document.querySelectorAll('.star-label');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = parseInt(star.getAttribute('data-value'));
                stars.forEach(s => {
                    const sValue = parseInt(s.getAttribute('data-value'));
                    s.classList.toggle('active', sValue <= value);
                });
            });
        });

        // 3. 폼 제출 및 구글 시트 전송
        const form = document.getElementById('surveyForm');
        const modal = document.getElementById('successModal');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('loadingSpinner');
        const btnText = document.getElementById('btnText');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // 로딩 상태 시작
            setLoading(true);

            // 폼 데이터 수집
            const formData = new FormData(form);
            
            // 유익했던 항목(체크박스) 데이터 정리
            const improvements = [];
            document.querySelectorAll('input[name="improvement"]:checked').forEach((checkbox) => {
                improvements.push(checkbox.value);
            });
            formData.delete('improvement'); 
            formData.append('improvement', improvements.join(', '));

            // 데이터 전송 (Fetch API)
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                console.log('Success!', response);
                modal.classList.add('show');
                setLoading(false);
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('전송 중 오류가 발생했습니다. 네트워크 연결을 확인하고 다시 시도해주세요.');
                setLoading(false);
            });
        });

        // 로딩 상태 제어 함수
        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                spinner.style.display = 'inline-block';
                btnText.textContent = '전송 중...';
            } else {
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = '설문 결과 제출하기';
            }
        }

        // 모달 닫기 및 초기화
        function closeModal() {
            modal.classList.remove('show');
            form.reset();
            stars.forEach(s => s.classList.remove('active'));
        }
    </script>
</body>
</html>
